                                        <div>
                                            <h1 className="text-2xl font-bold">College Compass</h1>
                                            <p className="text-white/60 text-sm">Premium Entrance Exam Portal</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-sm text-white/70">Welcome, <span className="text-purple-400 font-semibold capitalize">{username}</span></span>
                                    </div>
                                </div>
                            </div>
                        </header>
                        <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            <div className="mb-8">
                                <div className="backdrop-blur-2xl bg-white/5 border border-white/10 rounded-2xl p-6">
                                    <div className="flex flex-col md:flex-row gap-4">
                                        <div className="flex-1 relative">
                                            <LucideIcon name="search" className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-white/40" />
                                            <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Search exams..." className="w-full bg-white/5 border border-white/10 rounded-xl px-12 py-3 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-purple-500/50" />
                                        </div>
                                        <button onClick={() => setShowFilters(!showFilters)} className="px-6 py-3 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 flex items-center gap-2">
                                            <LucideIcon name="filter" className="w-5 h-5" />
                                            Filters
                                        </button>
                                    </div>
                                    {showFilters && (
                                        <div className="mt-4 pt-4 border-t border-white/10">
                                            <label className="block text-sm text-white/70 mb-2">Difficulty Level</label>
                                            <div className="flex flex-wrap gap-2">
                                                {['all', 'Very High', 'High', 'Moderate-High', 'Moderate'].map(l => (
                                                    <button key={l} onClick={() => setFilterDifficulty(l)} className={`px-4 py-2 rounded-lg transition-all ${filterDifficulty === l ? 'bg-purple-600 text-white' : 'bg-white/5 text-white/70'}`}>
                                                        {l === 'all' ? 'All Levels' : l}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {filteredExams.map((exam, i) => (
                                    <div key={exam.id} className="backdrop-blur-2xl bg-white/5 border border-white/10 rounded-2xl overflow-hidden hover:border-white/20 transition-all">
                                        <div className={`bg-gradient-to-br ${getDifficultyColor(exam.difficulty)} border-b border-white/10 p-6`}>
                                            <div className="flex items-start justify-between mb-3">
                                                <div>
                                                    <h3 className="text-2xl font-bold mb-1">{exam.name}</h3>
                                                    <p className="text-white/70 text-sm">{exam.fullName}</p>
                                                </div>
                                                <span className="px-3 py-1 bg-white/10 rounded-full text-xs font-semibold">{exam.difficulty}</span>
                                            </div>
                                            <div className="flex flex-wrap gap-2">
                                                {exam.degrees.map((d, j) => (
                                                    <span key={j} className="px-2.5 py-1 bg-white/10 rounded-lg text-xs">{d}</span>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="p-6">
                                            <div className="grid grid-cols-2 gap-4 mb-6">
                                                <div className="flex items-start gap-3">
                                                    <LucideIcon name="users" className="w-5 h-5 text-purple-400" />
                                                    <div><div className="text-white/60 text-xs mb-1">Candidates</div><div className="font-semibold">{exam.candidates}</div></div>
                                                </div>
                                                <div className="flex items-start gap-3">
                                                    <LucideIcon name="award" className="w-5 h-5 text-blue-400" />
                                                    <div><div className="text-white/60 text-xs mb-1">Total Seats</div><div className="font-semibold">{exam.seats}</div></div>
                                                </div>
                                                <div className="flex items-start gap-3">
                                                    <LucideIcon name="clock" className="w-5 h-5 text-cyan-400" />
                                                    <div><div className="text-white/60 text-xs mb-1">Duration</div><div className="font-semibold text-sm">{exam.duration}</div></div>
                                                </div>
                                                <div className="flex items-start gap-3">
                                                    <LucideIcon name="dollar-sign" className="w-5 h-5 text-green-400" />
                                                    
                                                </div>
                                            </div>
                                            <div className="space-y-3 mb-6">
                                                <div className="flex items-start gap-3 text-sm">
                                                    <LucideIcon name="calendar" className="w-4 h-4 text-orange-400 mt-0.5" />
                                                    <div><span className="text-white/60">Registration: </span><span className="font-medium">{exam.regDate}</span></div>
                                                </div>
                                                <div className="flex items-start gap-3 text-sm">
                                                    <LucideIcon name="calendar" className="w-4 h-4 text-pink-400 mt-0.5" />
                                                    <div><span className="text-white/60">Exam Date: </span><span className="font-medium">{exam.examDate}</span></div>
                                                </div>
                                            </div>
                                            <button onClick={() => setSelectedExam(exam)} className="w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2">
                                                <LucideIcon name="building-2" className="w-5 h-5" />
                                                View Top Colleges
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                    {selectedExam && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-gradient-to-br from-slate-900/95 to-indigo-900/95 backdrop-blur-2xl border border-white/20 rounded-3xl max-w-5xl w-full max-h-[90vh] overflow-y-auto">
                                <div className="sticky top-0 bg-gradient-to-r from-purple-600/20 to-blue-600/20 backdrop-blur-xl border-b border-white/10 p-6 flex items-center justify-between z-10">
                                    <div>
                                        <h2 className="text-3xl font-bold mb-1">{selectedExam.name}</h2>
                                        <p className="text-white/70">{selectedExam.fullName}</p>
                                    </div>
                                    <button onClick={() => setSelectedExam(null)} className="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center">
                                        <LucideIcon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="p-6">
                                    <h3 className="text-2xl font-bold mb-6 flex items-center gap-3">
                                        <LucideIcon name="building-2" className="w-7 h-7 text-purple-400" />
                                        Top Colleges & Details
                                    </h3>
                                    <div className="space-y-4">
                                        {selectedExam.topColleges.map((college, i) => (
                                            <div key={i} className="backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl p-6">
                                                <div className="flex items-start justify-between mb-4">
                                                    <div>
                                                        <h4 className="text-xl font-bold mb-1">{college.name}</h4>
                                                        <span className={`inline-block px-3 py-1 rounded-full text-xs font-semibold ${college.type === 'Government' ? 'bg-green-500/20 text-green-300' : 'bg-blue-500/20 text-blue-300'}`}>
                                                            {college.type}
                                                        </span>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-white/60 text-xs mb-1">Annual Fee</div>
                                                        <div className="text-lg font-bold text-purple-400">{college.fee}</div>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    <div className="bg-white/5 rounded-xl p-4">
                                                        <div className="flex items-center gap-2 mb-2">
                                                            <LucideIcon name="target" className="w-4 h-4 text-orange-400" />
                                                            <span className="text-white/60 text-sm">Cutoff</span>
                                                        </div>
                                                        <div className="text-lg font-bold">{college.cutoff}</div>
                                                    </div>
                                                    <div className="bg-white/5 rounded-xl p-4">
                                                        <div className="flex items-center gap-2 mb-2">
                                                            <LucideIcon name="trending-up" className="w-4 h-4 text-green-400" />
                                                            <span className="text-white/60 text-sm">Avg Package</span>
                                                        </div>
                                                        <div className="text-lg font-bold text-green-400">{college.avgPkg}</div>
                                                    </div>
                                                    <div className="bg-white/5 rounded-xl p-4">
                                                        <div className="flex items-center gap-2 mb-2">
                                                            <LucideIcon name="award" className="w-4 h-4 text-yellow-400" />
                                                            <span className="text-white/60 text-sm">Highest Package</span>
                                                        </div>
                                                        <div className="text-lg font-bold text-yellow-400">{college.highPkg}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CollegePortal />);
    </script>
</body>
</html>
